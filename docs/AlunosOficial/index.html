<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Importação CSV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">
    
    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Central de Cadastros Oficiais</h1>
            <p class="text-gray-500 text-sm mt-1">Sistema Restrito</p>
        </div>

        <!-- TELA DE LOGIN -->
        <div id="loginSection" class="block">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">E-mail Administrativo</label>
                <input type="email" id="email" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
                <input type="password" id="senha" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="fazerLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition">ENTRAR NO SISTEMA</button>
        </div>

        <!-- TELA DE IMPORTAÇÃO -->
        <div id="uploadSection" class="hidden">
            <div class="flex justify-between items-center mb-6 p-4 bg-green-50 text-green-800 rounded-lg border border-green-200">
                <span class="text-sm font-semibold" id="usuarioLogado">Autenticado...</span>
                <button onclick="fazerLogout()" class="text-sm font-bold text-red-600 hover:text-red-800">Sair</button>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">O que deseja importar?</label>
                <select id="tipoImportacao" class="w-full p-3 border rounded-lg font-semibold bg-gray-50" onchange="atualizarDicas()">
                    <option value="alunos">🎓 Planilha de Alunos</option>
                    <option value="professores">👨‍🏫 Planilha de Professores</option>
                </select>
            </div>

            <div class="border-2 border-dashed border-gray-300 rounded-lg p-10 text-center mb-6 hover:bg-gray-50 transition">
                <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="atualizarNomeFicheiro()">
                <label for="csvFile" class="cursor-pointer flex flex-col items-center">
                    <svg class="w-12 h-12 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="text-blue-600 font-semibold" id="fileName">Clique para selecionar a Planilha CSV</span>
                    <span class="text-gray-500 text-xs mt-2 font-bold" id="dicaColunas">
                        Colunas: nome, data_nascimento, documento, escola, serie, turma, turno, email_professor
                    </span>
                </label>
            </div>

            <button onclick="processarCSV()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg">ENVIAR DADOS</button>
            
            <div id="resultado" class="hidden mt-4 p-4 rounded-lg text-center text-sm font-medium"></div>
            <div id="logDetalhado" class="mt-4 hidden p-4 bg-red-50 text-red-700 text-xs text-left rounded-lg border border-red-200 max-h-40 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ COLOQUE AQUI SUAS CHAVES ⚠️
        // ==========================================
         const SUPABASE_URL = 'https://ojkkstibwifhbplakjfw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qa2tzdGlid2lmaGJwbGFramZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDMwODcxMDAsImV4cCI6MjA1ODY2MzEwMH0.lbLt4r03I4-kxQ0aNb9BFPDOnu9XIbay0zApus2Wrsw';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) alternarTelas(true, session.user.email);
        });

        function atualizarDicas() {
            const tipo = document.getElementById('tipoImportacao').value;
            const dica = document.getElementById('dicaColunas');
            if (tipo === 'alunos') {
                dica.textContent = 'Colunas: nome, data_nascimento, documento, escola, serie, turma, turno, email_professor';
            } else {
                dica.textContent = 'Colunas: nome, email'; // Professores simplificados!
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            mostrarMensagem('A autenticar...', 'info');
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
            if (error) mostrarMensagem('Falha no login: ' + error.message, 'error');
            else { mostrarMensagem('', 'limpar'); alternarTelas(true, data.user.email); }
        }

        async function fazerLogout() { await supabaseClient.auth.signOut(); alternarTelas(false, ''); }

        function alternarTelas(logado, email) {
            document.getElementById('loginSection').style.display = logado ? 'none' : 'block';
            document.getElementById('uploadSection').style.display = logado ? 'block' : 'none';
            document.getElementById('usuarioLogado').textContent = `Logado: ${email}`;
            mostrarMensagem('', 'limpar'); 
        }

        function atualizarNomeFicheiro() {
            const fileInput = document.getElementById('csvFile');
            if (fileInput.files.length > 0) document.getElementById('fileName').textContent = fileInput.files[0].name;
        }

        function formatarData(dataString) {
            if (!dataString) return null;
            const partes = dataString.trim().split('/');
            if (partes.length === 3) return `${partes[2]}-${partes[1]}-${partes[0]}`;
            return dataString;
        }

        async function processarCSV() {
            const fileInput = document.getElementById('csvFile');
            const tipo = document.getElementById('tipoImportacao').value;

            if (fileInput.files.length === 0) { mostrarMensagem('Selecione um CSV.', 'error'); return; }
            mostrarMensagem('A analisar planilha...', 'info');
            document.getElementById('logDetalhado').classList.add('hidden'); 

            Papa.parse(fileInput.files[0], {
                header: true, skipEmptyLines: true,
                complete: async function(results) {
                    const colunasLidas = results.meta.fields || [];
                    
                    // Validador atualizado com as novas colunas
                    const colunasExigidas = tipo === 'alunos' 
                        ? ['nome', 'data_nascimento', 'documento', 'escola', 'serie', 'turma', 'turno', 'email_professor']
                        : ['nome', 'email'];
                    
                    const colunasFaltando = colunasExigidas.filter(col => !colunasLidas.includes(col));
                    
                    if (colunasFaltando.length > 0) {
                        mostrarMensagem(`ERRO: Faltam colunas!`, 'error');
                        document.getElementById('logDetalhado').innerHTML = `<strong>Faltando:</strong> ${colunasFaltando.join(', ')}<br><strong>Lidas:</strong> ${colunasLidas.join(', ')}`;
                        document.getElementById('logDetalhado').classList.remove('hidden');
                        return;
                    }

                    mostrarMensagem(`A enviar dados para o servidor...`, 'info');
                    const dados = results.data;
                    let sucessos = 0, falhas = 0, listaErros = [];

                    for (const linha of dados) {
                        try {
                            let erroAoInserir;
                            if (tipo === 'alunos') {
                                const { error } = await supabaseClient.from('alunos_oficiais').insert({
                                    nome: linha.nome, 
                                    data_nascimento: formatarData(linha.data_nascimento),
                                    documento: linha.documento, 
                                    escola: linha.escola, 
                                    serie: linha.serie,
                                    turma: linha.turma, // Ex: "A"
                                    turno: linha.turno, // Ex: "Matutino"
                                    email_professor: linha.email_professor // O Elo de ligação com o professor!
                                });
                                erroAoInserir = error;
                            } else {
                                const { error } = await supabaseClient.from('professores_aplicadores').insert({
                                    nome: linha.nome, 
                                    email: linha.email
                                });
                                erroAoInserir = error;
                            }

                            if (erroAoInserir) throw erroAoInserir;
                            sucessos++;
                        } catch (err) {
                            falhas++;
                            const identificador = tipo === 'alunos' ? linha.documento : linha.email;
                            listaErros.push(`Falha em [${identificador}]: ${err.message || JSON.stringify(err)}`);
                        }
                    }

                    if (falhas > 0) {
                        mostrarMensagem(`Importados: ${sucessos} | Falhas: ${falhas}`, 'error');
                        document.getElementById('logDetalhado').innerHTML = listaErros.join('<br>');
                        document.getElementById('logDetalhado').classList.remove('hidden');
                    } else {
                        mostrarMensagem(`Sucesso! ${sucessos} cadastros importados.`, 'success');
                    }
                }
            });
        }

        function mostrarMensagem(texto, tipo) {
            const div = document.getElementById('resultado');
            if (tipo === 'limpar') { div.classList.add('hidden'); document.getElementById('logDetalhado').classList.add('hidden'); return; }
            div.className = `p-4 rounded-lg text-center text-sm font-medium mt-4 ${tipo === 'error' ? 'bg-red-100 text-red-700' : tipo === 'info' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`;
            div.textContent = texto;
            div.classList.remove('hidden');
        }
    </script>
</body>
</html>
